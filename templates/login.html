<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combinaisons — accès</title>
<link rel="icon" href="{{ url_for('static', filename='cards/17.svg') }}">
<style>
  /* Without this the inputs' padding and border are added to their 100% width,
     so they overflow the form box to the right and stop lining up with the
     heading above them. */
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: grid; place-items: center; padding: 24px;
    background: #f4ecdd; color: #2f2b3d;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  .box { width: min(360px, 88vw); text-align: center; }
  h1 { font-family: Georgia, serif; font-size: 30px; font-weight: normal; margin: 0 0 6px; }
  p { color: #6c6580; font-size: 15px; margin: 0 0 22px; }
  input, button { font: inherit; font-size: 16px; width: 100%; padding: 11px 13px; border-radius: 9px; }
  input { border: 1px solid #ded1b8; background: #fbf6ec; text-align: center; letter-spacing: 3px; }
  input:focus { outline: none; border-color: #b9902f; box-shadow: 0 0 0 3px rgba(185,144,47,.15); }
  button { margin-top: 10px; border: 1px solid #2f2b3d; background: #2f2b3d; color: #f7f1e4; cursor: pointer; }
  .err { color: #a94436; font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
  <form class="box" method="post">
    <h1>Bonjour Corinne.</h1>
    <p>Entrez le code d'accès</p>
    <input name="code" type="password" autofocus autocomplete="current-password" inputmode="text">
    <button type="submit">Entrer</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
